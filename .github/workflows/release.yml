name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npx prettier --check .

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package build
        run: npm run check:package

      # Paint, layout, and the browser's own editing pipeline. Screenshots are
      # left out; only the assertions run here.
      - name: Browser checks
        run: npm run visual:check

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
